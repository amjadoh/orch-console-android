# بناء APK موقّع لتطبيق المنظّم (TWA). كل دفع يبني ويتحقق من التوقيع.
# الوسم v* (مثل v1.0.0) يسوي إصدار (Release) خاص فيه ملف APK مباشر.
name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # لإنشاء الإصدار من الوسم بس

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
            [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "bad tag $name" >&2; exit 1; }
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name="1.0.0-dev.${GITHUB_RUN_NUMBER}"
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          ORCH_KEYSTORE_BASE64: ${{ secrets.ORCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$ORCH_KEYSTORE_BASE64"
          printf '%s' "$ORCH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orch-release.p12"

      - name: Build signed APK
        env:
          ORCH_KEYSTORE_PATH: ${{ runner.temp }}/orch-release.p12
          ORCH_KEYSTORE_PASSWORD: ${{ secrets.ORCH_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ORCH_KEYSTORE_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$signer" verify --verbose --print-certs "$apk" | tee signing.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signing.txt
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$aapt" dump badging "$apk" | head -3 | tee -a signing.txt
          mkdir -p out
          cp "$apk" "out/orch-console-${{ steps.ver.outputs.name }}.apk"
          sha256sum out/*.apk | tee -a signing.txt
          cp signing.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: orch-console-${{ steps.ver.outputs.name }}
          path: out/
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk out/signing.txt \
            --title "المنظّم ${{ steps.ver.outputs.name }}" \
            --notes "تطبيق المنظّم (TWA) — نزّل ملف APK وثبّته على الجوال. يحتاج Tailscale شغّال وChrome."
